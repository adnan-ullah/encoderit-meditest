buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')

    // Keep build output clean from third-party plugin Java warnings
    // (deprecated/unchecked in pub-cache plugins).
    tasks.withType(JavaCompile).configureEach {
        options.warnings = false
        options.deprecation = false
        options.compilerArgs += ['-nowarn', '-Xlint:none', '-Xlint:-deprecation', '-Xlint:-unchecked']
    }

    plugins.withId("com.android.application") {
        android {
            buildFeatures {
                buildConfig = true
            }
        }
    }

    plugins.withId("com.android.library") {
        android {
            // If the library hasn't set a namespace, derive it from the manifest package.
            if (!namespace) {
                def manifest = file("src/main/AndroidManifest.xml")
                if (manifest.exists()) {
                    def manifestText = manifest.getText('UTF-8')
                    def matcher = (manifestText =~ /package="([^"]+)"/)
                    if (matcher.find()) {
                        namespace matcher.group(1)
                    }
                }
            }

            buildFeatures {
                buildConfig = true
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
